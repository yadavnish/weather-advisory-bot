<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather-Advisory Support Bot</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --border: #262b36;
      --text: #e7e9ee;
      --muted: #8b93a3;
      --accent: #5b8cff;
      --sev1: #4b5568;
      --sev2: #d8a53f;
      --sev3: #d87e3f;
      --sev4: #d8523f;
      --sev5: #b23a3a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
    }

    .sidebar {
      width: 300px;
      border-right: 1px solid var(--border);
      padding: 16px;
      overflow-y: auto;
      flex-shrink: 0;
    }

    .sidebar h2 {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin: 0 0 12px;
    }

    .sop-row {
      padding: 8px 10px;
      border-radius: 8px;
      margin-bottom: 6px;
      background: var(--panel);
      border: 1px solid var(--border);
      font-size: 12px;
    }

    .sop-row .id {
      font-weight: 600;
    }

    .sop-row .sev {
      float: right;
      padding: 1px 6px;
      border-radius: 999px;
      font-size: 10px;
      color: #fff;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
    }

    header h1 {
      font-size: 15px;
      margin: 0;
    }

    header p {
      font-size: 12px;
      color: var(--muted);
      margin: 4px 0 0;
    }

    #log {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .msg {
      max-width: 640px;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .user {
      align-self: flex-end;
      background: var(--accent);
      color: white;
    }

    .bot {
      align-self: flex-start;
      background: var(--panel);
      border: 1px solid var(--border);
    }

    .trace {
      align-self: flex-start;
      max-width: 640px;
      font-size: 11px;
      color: var(--muted);
      background: #12141a;
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 8px 10px;
    }

    .trace b {
      color: var(--text);
    }

    form {
      display: flex;
      gap: 8px;
      padding: 16px;
      border-top: 1px solid var(--border);
    }

    input[type=text] {
      flex: 1;
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 14px;
    }

    input[type=text]:focus {
      outline: none;
      border-color: var(--accent);
    }

    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    button:disabled {
      opacity: 0.5;
      cursor: default;
    }
  </style>
</head>

<body>
  <div class="sidebar">
    <h2>Loaded SOPs (policy-as-data)</h2>
    <div id="sop-list">Loading…</div>
  </div>
  <main>
    <header>
      <h1>Weather-Advisory Support Bot</h1>
      <p>Policy-first &middot; fully traceable &middot; SOPs are data, not prompt text</p>
    </header>
    <div id="log"></div>
    <form id="form">
      <input id="input" type="text" placeholder="e.g. Is it safe to cycle in Bengaluru right now?" autocomplete="off" />
      <button type="submit">Ask</button>
    </form>
  </main>

  <script>
    const API_BASE = window.API_BASE || "http://localhost:8000";
    const sessionId = "web-" + Math.random().toString(36).slice(2);
    const log = document.getElementById("log");
    const form = document.getElementById("form");
    const input = document.getElementById("input");

    const sevColor = { 1: "var(--sev1)", 2: "var(--sev2)", 3: "var(--sev3)", 4: "var(--sev4)", 5: "var(--sev5)" };

    async function loadSops() {
      try {
        const res = await fetch(`${API_BASE}/sops`);
        const sops = await res.json();
        document.getElementById("sop-list").innerHTML = sops.map(s => `
      <div class="sop-row">
        <span class="id">${s.id}</span>
        <span class="sev" style="background:${sevColor[s.severity] || '#555'}">sev ${s.severity}</span>
        <div style="color:var(--muted); margin-top:2px;">${s.category} &middot; ${s.match_type}</div>
      </div>`).join("");
      } catch (e) {
        document.getElementById("sop-list").innerText = "Backend not reachable at " + API_BASE;
      }
    }
    loadSops();

    function addMsg(text, cls) {
      const div = document.createElement("div");
      div.className = "msg " + cls;
      div.textContent = text;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    function addTrace(resp) {
      const div = document.createElement("div");
      div.className = "trace";
      const others = resp.other_matched_sop_ids?.length ? resp.other_matched_sop_ids.join(", ") : "none";
      const weather = resp.weather_snapshot ? Object.entries(resp.weather_snapshot).map(([k, v]) => `${k}=${v}`).join(", ") : "n/a";
      div.innerHTML = `<b>primary SOP:</b> ${resp.primary_sop_id ?? "none"} &nbsp; <b>also matched:</b> ${others} &nbsp; <b>grounded:</b> ${resp.grounded}<br><b>weather used:</b> ${weather}`;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const question = input.value.trim();
      if (!question) return;
      addMsg(question, "user");
      input.value = "";
      input.disabled = true;

      try {
        const res = await fetch(`${API_BASE}/ask`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: sessionId, question, location_hint: extractLocation(question) }),
        });
        const data = await res.json();
        addMsg(data.answer, "bot");
        addTrace(data);
      } catch (err) {
        addMsg("Error reaching backend: " + err.message, "bot");
      } finally {
        input.disabled = false;
        input.focus();
      }
    });

    // Very light heuristic: "in <Place>" / "at <Place>" / "for <Place>" tail of the question.
    function extractLocation(q) {
      const matches = [
        ...q.matchAll(
          /\b(?:in|at|near)\s+([A-Z][a-zA-Z\s]+?)(?=\s+(?:today|tomorrow|tonight|now|right now|this morning|this afternoon|this evening|if|when|because|with|and)\b|[\?\.,]|$)/gi
        )
      ];

      if (matches.length > 0) {
        return matches[matches.length - 1][1].trim();
      }

      // Do not treat phrases like "for outdoor exercise" as locations.
      // Location should be omitted so the backend can reuse session memory.
      return null;
    }
  </script>
</body>

</html>
